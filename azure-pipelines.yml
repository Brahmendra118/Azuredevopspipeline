trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.9'
  dockerRegistryServiceConnection: 'azure-service-connection'
  imageRepository: 'ai-flask-app'
  containerRegistry: 'pipeineregisry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

# =========================================================
# STAGE 1 - TEST
# =========================================================
- stage: Test
  displayName: 'Test Application'

  jobs:
  - job: Test
    displayName: 'Run Python Tests'

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.9'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        pytest -v
      displayName: 'Run Tests'


# =========================================================
# STAGE 2 - BUILD AND PUSH DOCKER IMAGE
# =========================================================
- stage: Build
  displayName: 'Build and Push Docker Image'
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: Build
    displayName: 'Build Docker Image'

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest


# =========================================================
# STAGE 3 - DEPLOY TO AZURE VM
# =========================================================
- stage: Deploy
  displayName: 'Deploy to Azure VM'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Docker Container'

    steps:

    - task: SSH@0
      displayName: 'Deploy AI Agent to VM'
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'commands'
        commands: |
          set -e

          echo "STEP 1 - Connected to Azure VM"
          whoami

          echo "STEP 2 - Checking Docker"
          /usr/bin/docker --version

          echo "STEP 3 - Logging into Azure"
          /usr/bin/az login --identity --allow-no-subscriptions

          echo "STEP 4 - Logging into ACR"
          /usr/bin/az acr login --name pipeineregisry

          echo "STEP 5 - Pulling Docker image"
          /usr/bin/docker pull pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "STEP 6 - Checking old container"
          /usr/bin/docker ps -a

          echo "STEP 7 - Removing old container if it exists"
          /usr/bin/docker rm -f ai-flask-app 2>/dev/null || true

          echo "STEP 8 - Checking environment file"
          test -r /home/azureuser/.openai_env

          echo "STEP 9 - Starting New Container"
          /usr/bin/docker run -d --name ai-flask-app --restart unless-stopped -p 127.0.0.1:8000:8000 --env-file /home/azureuser/.openai_env pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "STEP 10 - Checking container"
          /usr/bin/docker ps

          echo "STEP 11 - Deployment successful"