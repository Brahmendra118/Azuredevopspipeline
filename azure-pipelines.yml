trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.9'
  dockerRegistryServiceConnection: 'azure-service-connection'
  imageRepository: 'ai-flask-app'
  containerRegistry: 'pipeineregisry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

# =========================
# STAGE 1 - TEST
# =========================

- stage: Test
  displayName: 'Test Application'

  jobs:
  - job: Test
    displayName: 'Run Python Tests'

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.9'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        pytest -v
      displayName: 'Run Tests'


# =========================
# STAGE 2 - DOCKER BUILD
# =========================

- stage: Build
  displayName: 'Build and Push Docker Image'

  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: Build
    displayName: 'Build Docker Image'

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest


# =========================
# STAGE 3 - DEPLOY TO VM
# =========================

- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Docker Container'

    steps:

    - task: SSH@0
      displayName: 'Deploy AI Agent to VM'
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'inline'
        inline: |
          set -e

          echo "======================================"
          echo "Starting deployment"
          echo "======================================"

          echo "Checking Azure CLI..."
          /usr/bin/az --version

          echo "Checking Docker..."
          /usr/bin/docker --version

          echo "Logging into Azure using Managed Identity..."
          /usr/bin/az login --identity --allow-no-subscriptions

          echo "Logging into Azure Container Registry..."
          /usr/bin/az acr login --name pipeineregisry

          echo "Pulling latest Docker image..."
          /usr/bin/docker pull pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "Stopping old container..."
          /usr/bin/docker stop ai-flask-app || true

          echo "Removing old container..."
          /usr/bin/docker rm ai-flask-app || true

          echo "Starting new container..."
          /usr/bin/docker run -d \
            --name ai-flask-app \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            --env-file /root/.openai_env \
            pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "Waiting for container..."
          sleep 5

          echo "Checking container status..."
          /usr/bin/docker ps

          echo "Checking API key..."
          /usr/bin/docker exec ai-flask-app sh -c 'test -n "$OPENAI_API_KEY" && echo "API key loaded successfully" || (echo "API key missing"; exit 1)'

          echo "Checking application..."
          /usr/bin/curl -f http://127.0.0.1:8000/ || exit 1

          echo "======================================"
          echo "Deployment successful!"
          echo "======================================"
