trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.9'
  dockerRegistryServiceConnection: 'azure-service-connection'
  imageRepository: 'ai-flask-app'
  containerRegistry: 'pipeineregisry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

# =========================
# STAGE 1 - TEST
# =========================

- stage: Test
  displayName: 'Test Application'

  jobs:
  - job: Test
    displayName: 'Run Python Tests'

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.9'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        pytest -v
      displayName: 'Run Tests'


# =========================
# STAGE 2 - DOCKER BUILD
# =========================

- stage: Build
  displayName: 'Build and Push Docker Image'

  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: Build
    displayName: 'Build Docker Image'

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest


# =========================
# STAGE 3 - DEPLOY TO VM
# =========================
- stage: Deploy
  displayName: 'Deploy to Azure VM'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Docker Container'

    steps:
    - task: SSH@0
      displayName: 'Test VM Command'
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'commands'
        commands: |
           echo "HELLO FROM AZURE VM"
           /usr/bin/docker --version
