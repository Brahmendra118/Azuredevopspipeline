trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.9'
  dockerRegistryServiceConnection: 'azure-service-connection'
  imageRepository: 'ai-flask-app'
  containerRegistry: 'pipeineregisry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

# =========================
# STAGE 1 - TEST
# =========================

- stage: Test
  displayName: 'Test Application'

  jobs:
  - job: Test
    displayName: 'Run Python Tests'

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.9'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        pytest -v
      displayName: 'Run Tests'


# =========================
# STAGE 2 - DOCKER BUILD
# =========================

- stage: Build
  displayName: 'Build and Push Docker Image'

  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: Build
    displayName: 'Build Docker Image'

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest


# =========================
# STAGE 3 - DEPLOY TO VM
# =========================
- stage: Deploy
  displayName: 'Deploy to Azure VM'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Docker Container'

    steps:
    - task: SSH@0
      displayName: 'Deploy AI Agent to VM'
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'inline'
        inline: |
          set -x

          echo "STEP 1 - Connected to VM"

          echo "STEP 2 - Checking Docker"
          /usr/bin/docker --version

          echo "STEP 3 - Checking Azure CLI"
          /usr/bin/az --version

          echo "STEP 4 - Checking ACR login"
          /usr/bin/az acr login --name pipeineregisry

          echo "STEP 5 - Pulling image"
          /usr/bin/docker pull pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "STEP 6 - Stopping old container"
          /usr/bin/docker stop ai-flask-app || true

          echo "STEP 7 - Removing old container"
          /usr/bin/docker rm ai-flask-app || true

          echo "STEP 8 - Starting new container"
          /usr/bin/docker run -d \
            --name ai-flask-app \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            --env-file /root/.openai_env \
            pipeineregisry.azurecr.io/ai-flask-app:latest

          echo "STEP 9 - Checking deployment"
          /usr/bin/docker ps

          echo "STEP 10 - Deployment successful"