<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant</title>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<h1>AI Assistant</h1>

<form method="POST">

    <textarea
        name="text"
        placeholder="Ask something..."
        required></textarea>

    <br>

    <button type="submit">
        Ask AI
    </button>

</form>

{% if response %}

<div class="response">

    <h2>AI Response</h2>

    <p>{{ response }}</p>

</div>

{% endif %}

</body>
</html>
